
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-database-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  labels:
    app: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: ghcr.io/ncpdart/ticketmei-order:0650b6e51a1a0967057fa6e9c14048b0926d3fe1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: CATALOG_URL
              value: "http://catalog:8001"
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq"
          volumeMounts:
            - name: order-database
              mountPath: /app/database
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m" 
      volumes:
        - name: order-database
          persistentVolumeClaim:
            claimName: order-database-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: order
spec:
  type: ClusterIP
  selector:
    app: order
  ports:
    - name: http
      port: 8002
      targetPort: 8002
      protocol: TCP
