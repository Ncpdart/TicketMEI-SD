apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: ghcr.io/ncpdart/ticketmei-notification:ae20bc02a0f8b768228f68060d748e6598172286
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq"
          volumeMounts:
            - name: notification-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m" 
      volumes:
        - name: notification-data
          persistentVolumeClaim:
            claimName: notification-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: notification
spec:
  type: ClusterIP
  selector:
    app: notification
  ports:
    - name: http
      port: 8003
      targetPort: 8003
      protocol: TCP