services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      CATALOG_URL: http://catalog:8001
      ORDER_URL: http://order:8002
    depends_on:
      - catalog
      - order

  catalog:
    build: ./catalog
    ports:
      - "8001:8001"

  order:
    build: ./order
    ports:
      - "8002:8002"
    environment:
      API_GATEWAY_URL: http://api-gateway:8000
      RABBITMQ_URL: amqp://rabbitmq
    volumes:
      - ./order/database:/app/database
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification:
    build: ./notification
    ports:
      - "8003:8003"
    environment:
      RABBITMQ_URL: amqp://rabbitmq
    volumes:
      - ./notification/data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api-gateway
      - catalog
      - order
      - notification

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
